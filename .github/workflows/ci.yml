# Two questions, asked on every push.
#
# 1. Does the Mac build still work, and do its tests still pass? Blocking.
# 2. How far is the Windows build from compiling at all? Not blocking yet —
#    see the note on that job. This is the ratchet described in docs/WINDOWS.md:
#    the port is a long refactor, and the only thing that keeps it honest is a
#    machine that notices when a macOS-only call lands in shared code.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: Tests (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # First, because it is the cheapest question asked here and the one whose
      # answer a Mac cannot otherwise give: do both platform backends still
      # offer the same surface? Only one side is ever compiled, so a function
      # deleted from the other is invisible until the Windows job fails minutes
      # later — which has happened twice.
      - name: Platform parity
        run: npm run parity

      - name: Types
        run: npm run typecheck

      - name: Front-end tests
        run: npm test

      # `tauri_build::build()` wants the frontend output to exist, so the
      # bundle has to be built before the Rust tests can even compile.
      - name: Build the front end
        run: npm run build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  windows:
    name: Portability check (Windows)
    runs-on: windows-latest
    # BLOCKING, as of the run that first went green (e556741). It was not, for
    # the two runs it took to get there: a job that is red on every pull
    # request from the first day is a job everyone learns to scroll past, so it
    # only earns the right to block once it can pass.
    #
    # It can now. Shotly compiles for Windows — as stubs that refuse at
    # runtime, not as a working app, which is the whole of docs/WINDOWS.md —
    # and that is exactly the property worth defending. From here, anything
    # reaching for a macOS API from shared code turns this red, which is the
    # only thing that keeps the platform split honest across a port measured
    # in months.
    #
    # It has already earned it. The first two runs found an ungated
    # objc2-core-video that dragged a compile_error! onto Windows, a POSIX-only
    # chmod in share::gauth, and two stubs a careless edit had deleted from
    # platform/windows/shell.rs — none of which anything on a Mac could see.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build the front end
        run: npm run build

      # `check`, not `build`: the question is whether the source is portable,
      # and answering it does not require a linkable binary.
      - name: Does it compile for Windows?
        run: cargo check --manifest-path src-tauri/Cargo.toml
