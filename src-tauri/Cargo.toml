[package]
name = "shotly"
version = "0.10.3"
description = "Capture, annotate, ship."
authors = ["Ty Omidi"]
edition = "2021"

[lib]
name = "shotly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [
  "tray-icon",
  "image-png",
  "macos-private-api",
  "protocol-asset",
] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
# Relaunching into a freshly installed update.
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.23"
tempfile = "3"
# Two things the standard library has no word for: local time, and asking a
# child process to stop rather than die. See `commands::stamped_stem` and
# `record::interrupt`.
libc = "0.2"
arboard = { version = "3", features = ["image-data"] }
ureq = { version = "3.4.0", default-features = false, features = ["json", "rustls"] }
sha2 = "0.11.0"
keyring = { version = "3", default-features = false, features = ["apple-native"] }
objc2-core-video = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"
objc2 = "0.6"
# Cutting a recording down: an AVMutableComposition of the parts to keep, and a
# passthrough export of it. See `trim.rs` for why this and not a subprocess.
objc2-av-foundation = { version = "0.3", features = [
  "AVAsset",
  "AVAssetExportSession",
  "AVComposition",
  "AVMediaFormat",
  "block2",
  "objc2-core-media",
] }
objc2-core-media = { version = "0.3", features = ["CMTime", "CMTimeRange"] }
block2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
  "NSWindow",
  "NSResponder",
  "NSApplication",
  "NSColor",
  "NSGraphics",
  "NSPasteboard",
  "NSPasteboardItem",
  "objc2-core-foundation",
] }
objc2-foundation = "0.3"
objc2-vision = "0.3.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Opening at login, as a LaunchAgent pointing at the installed bundle.
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"

# Optimised for speed rather than size: this profile only ever builds the
# artefact people install, and image decode/encode is the app's hot path —
# opt-level 3 measured 1.8x faster than "s" at generating library thumbnails,
# for about 1.4 MB more binary. Day-to-day debugging happens on `dev`.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Unwind, not abort — and this is a bug fix, not a preference.
#
# 0.9.5 aborted twice in one evening from a panic inside wry's URL-scheme
# handler, on the thread `media.rs` answers range requests from. WKWebView
# throws if you answer a task it has already stopped, which is what happens
# when the player's source is swapped while a range request is in flight —
# switching to a freshly trimmed recording does exactly that. wry wraps that
# delivery in `objc2::exception::catch` because it expects to have to; with
# `panic = "abort"` there is nothing to catch with, and the whole app goes.
#
# The general point outweighs the specific one: in a capture tool, a panic on
# a worker thread — a thumbnail, a range request, an export — should cost that
# one piece of work, not the session and whatever is on screen. Unwinding lets
# tokio turn it into a failed task and an error message. It costs some binary
# size and nothing that matters.
panic = "unwind"
# Keep the symbol table. `strip = true` cost an hour of guesswork on the crash
# above: an `.ips` full of `?` cannot be read, and rebuilding the exact commit
# unstripped only *nearly* reproduces the addresses (measured 316 bytes of
# drift in __text), which is enough to send you after the wrong function.
strip = "debuginfo"
