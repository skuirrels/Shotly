[package]
name = "shotly"
version = "0.1.6"
description = "Capture, annotate, ship."
authors = ["Ty Omidi"]
edition = "2021"

[lib]
name = "shotly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [
  "tray-icon",
  "image-png",
  "macos-private-api",
  "protocol-asset",
] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
# Relaunching into a freshly installed update.
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
tempfile = "3"
arboard = { version = "3", features = ["image-data"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
  "NSWindow",
  "NSResponder",
  "NSApplication",
  "NSColor",
  "NSGraphics",
  "NSPasteboard",
  "NSPasteboardItem",
  "objc2-core-foundation",
] }
objc2-foundation = "0.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"

# Optimised for speed rather than size: this profile only ever builds the
# artefact people install, and image decode/encode is the app's hot path —
# opt-level 3 measured 1.8x faster than "s" at generating library thumbnails,
# for about 1.4 MB more binary. Day-to-day debugging happens on `dev`.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
